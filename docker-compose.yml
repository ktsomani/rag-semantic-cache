services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - redis
    volumes:
      - ./data:/app/data   # <--- ADD THIS LINE

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
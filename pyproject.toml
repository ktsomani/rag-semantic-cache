[project]
name = "rag-attribution"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kartik Somani", email = "kartiksomani500@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "fastapi>=0.162.0",
    "label-studio-sdk>=2.1.3",
    "llama-index>=0.14.25",
    "llama-index-llms-openai>=0.7.10",
    "locust>=2.47.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "sse-starlette>=3.6.0",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-attribution = "rag_attribution:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.workspace]
members = [
    "rag-attribution",
]
